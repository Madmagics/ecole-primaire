name: Déployer le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exporter le jeu (Web)
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: "https://downloads.godotengine.org/?version=4.7&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          godot_export_templates_download_url: "https://downloads.godotengine.org/?version=4.7&flavor=stable&slug=export_templates.tpz&platform=templates"
          relative_project_path: ./
          presets_to_export: "Web"
          cache: true

      - name: Publier sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.export.outputs.build_directory }}
          cname: www.ecole-primaire.eu