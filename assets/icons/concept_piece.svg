<!-- Icone concept "Piece" (2026-08-01, recoloree le meme jour) - vectoriel ecrit a la main, style
     plat/cartoon coherent avec CHARTE_GRAPHIQUE.md (aplats, pas de degrade/ombre, contour epais
     encre). Base en gris neutre (pas d'or fixe) : CrateItem/GradeUnlockItem appliquent
     modulate = CardRarity.get_color(...) au runtime pour teinter la piece selon la rarete/classe
     concernee - un gris neutre donne un resultat propre par multiplication, une base doree
     aurait donne des teintes sales sur les couleurs froides (bleu, violet...). Voir
     CHARTE_GRAPHIQUE.md. -->
