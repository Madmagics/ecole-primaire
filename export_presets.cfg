html/head_include="<style>
#status-progress {
  width: 320px;
  height: 22px;
  border: 3px solid #7A4A2B;
  border-radius: 12px;
  background: #FFF0D6;
  -webkit-appearance: none;
  appearance: none;
}
#status-progress::-webkit-progress-bar {
  background: #FFF0D6;
  border-radius: 8px;
}
#status-progress::-webkit-progress-value {
  background: #FFDD57;
  border-radius: 8px;
  transition: width 0.2s ease;
}
#status-progress::-moz-progress-bar {
  background: #FFDD57;
  border-radius: 8px;
}
</style>
<script src=\"https://challenges.cloudflare.com/turnstile/v0/api.js\" async defer></script>
<style>
#iab-overlay{position:fixed;inset:0;z-index:99999;background:rgba(40,25,15,.85);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#iab-box{background:#FFF0D6;border:3px solid #7A4A2B;border-radius:16px;max-width:420px;width:100%;padding:20px;color:#4A2C17;text-align:center;line-height:1.4}
#iab-box h2{margin:0 0 10px;font-size:20px}
#iab-box p{margin:8px 0;font-size:15px}
#iab-box .iab-btn{display:block;width:100%;margin-top:12px;padding:12px;border-radius:12px;font-size:16px;font-weight:bold;border:3px solid #7A4A2B;cursor:pointer}
#iab-open{background:#FFDD57;color:#4A2C17}
#iab-skip{background:transparent;color:#7A4A2B;border-color:transparent;font-weight:normal;font-size:14px}
</style>
<script>
(function(){
  var ua=navigator.userAgent||'';
  var force=location.search.indexOf('test_iab')!==-1;
  var inApp=/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger/i.test(ua);
  if(!inApp&&!force)return;
  var isAndroid=/Android/i.test(ua);
  function show(){
    var o=document.createElement('div');o.id='iab-overlay';
    var html='<div id=iab-box><h2>🎮 Pour bien jouer…</h2>'+
      '<p>École Primaire est optimisé pour être joué <b>en plein écran</b>, dans votre navigateur habituel (Chrome, Safari…).</p>'+
      '<p>Le navigateur de Facebook est plus limité : le plein écran et les sauvegardes peuvent mal fonctionner.</p>';
    if(isAndroid){
      html+='<button class=iab-btn id=iab-open>Ouvrir dans Chrome</button>';
    }else{
      html+='<p><b>Touchez ⋯ (en haut à droite), puis « Ouvrir dans le navigateur ».</b></p>';
    }
    html+='<button class=iab-btn id=iab-skip>Continuer ici quand même</button></div>';
    o.innerHTML=html;document.body.appendChild(o);
    var b=document.getElementById('iab-open');
    if(b){b.onclick=function(){
      location.href='intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';
    };}
    document.getElementById('iab-skip').onclick=function(){o.remove();};
  }
  if(document.body)show();else document.addEventListener('DOMContentLoaded',show);
})();
</script>"
