<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialisation du mot de passe — École Primaire</title>
<style>
	:root {
		--ink: #4A2E1A;
		--fond: #FBF3E7;
		--carte: #FFFFFF;
		--vert: #3F8F5F;
		--rouge: #C0453A;
		--bordure: #E4D3B8;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--fond);
		color: var(--ink);
		font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		padding: 24px;
	}
	.carte {
		background: var(--carte);
		border: 3px solid var(--bordure);
		border-radius: 20px;
		max-width: 420px;
		width: 100%;
		padding: 36px 28px;
		text-align: center;
		box-shadow: 0 6px 0 var(--bordure);
	}
	.icone { font-size: 56px; line-height: 1; margin-bottom: 12px; }
	h1 { font-size: 22px; margin: 0 0 12px; }
	p { font-size: 16px; line-height: 1.5; margin: 0 0 16px; opacity: 0.85; }
	.statut-ok h1 { color: var(--vert); }
	.statut-erreur h1 { color: var(--rouge); }
	label { display: block; text-align: left; font-size: 14px; margin: 12px 0 4px; }
	input[type="password"] {
		width: 100%;
		padding: 10px 12px;
		border: 2px solid var(--bordure);
		border-radius: 10px;
		font-size: 16px;
		color: var(--ink);
	}
	button {
		margin-top: 20px;
		width: 100%;
		padding: 12px;
		border: none;
		border-radius: 12px;
		background: var(--ink);
		color: var(--fond);
		font-size: 16px;
		font-weight: bold;
		cursor: pointer;
	}
	button:disabled { opacity: 0.6; cursor: default; }
	.erreur-champ { color: var(--rouge); font-size: 14px; text-align: left; margin: 4px 0 0; display: none; }
</style>
</head>
<body>
	<div class="carte" id="carte">
		<h1>Choisis un nouveau mot de passe</h1>
		<p>Ce lien est valable 1 heure et ne peut être utilisé qu'une seule fois.</p>
		<form id="formulaire">
			<label for="mdp">Nouveau mot de passe</label>
			<input type="password" id="mdp" minlength="4" required>
			<label for="mdp2">Confirmer le mot de passe</label>
			<input type="password" id="mdp2" minlength="4" required>
			<p class="erreur-champ" id="erreur-champ"></p>
			<button type="submit" id="bouton">Valider</button>
		</form>
	</div>

	<script>
		// Mêmes clé/URL publiques "anon" que verifier-email.html/captcha.html (voir leur
		// commentaire) - non secrètes par design, uniquement une porte d'entrée vers PostgREST.
		const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5MjMyOTUyLCJleHAiOjE5NDY5MTI5NTJ9.U5jI5pXgwMonbnpiOvlHKtxUShJ8jLWtgdMHwkecoXQ";
		const RPC_URL = "https://api.ecole-primaire.eu/rest/v1/rpc/fn_reinitialiser_mdp";
		// Doit rester synchronisée avec SaveManager.MIN_PASSWORD_LENGTH (save_manager.gd) - cette
		// page est statique, elle ne peut pas lire cette constante directement.
		const LONGUEUR_MIN_MDP = 4;

		function afficherCarte(html) {
			document.getElementById("carte").innerHTML = html;
		}

		function afficherResultat(icone, classe, titre, texte) {
			afficherCarte(
				'<div class="icone">' + icone + '</div>' +
				'<h1>' + titre + '</h1>' +
				'<p>' + texte + '</p>'
			);
			document.getElementById("carte").className = "carte statut-" + classe;
		}

		// sha256(sel + mot de passe), hex minuscules - EXACTEMENT le même algorithme que
		// SaveManager._hash_password() côté Godot (String.sha256_text()), pour que le nouveau
		// hash calculé ici soit vérifiable de la même façon à la prochaine connexion.
		async function hacherMotDePasse(sel, motDePasse) {
			const donnees = new TextEncoder().encode(sel + motDePasse);
			const empreinte = await crypto.subtle.digest("SHA-256", donnees);
			return Array.from(new Uint8Array(empreinte))
				.map(function (octet) { return octet.toString(16).padStart(2, "0"); })
				.join("");
		}

		// Sel aléatoire en hexadécimal, même longueur (16 octets = 32 caractères hex) que
		// SaveManager.SALT_BYTE_LENGTH - généré ICI (page web), jamais réutilisé d'un ancien sel :
		// une réinitialisation de mot de passe change aussi le sel, même principe que
		// fn_creer_compte côté serveur.
		function genererSelHex() {
			const octets = new Uint8Array(16);
			crypto.getRandomValues(octets);
			return Array.from(octets).map(function (octet) { return octet.toString(16).padStart(2, "0"); }).join("");
		}

		const MESSAGES_ERREUR = {
			token_invalide: "Ce lien de réinitialisation n'est pas valide. Vérifie que tu as bien copié le lien complet reçu par email.",
			token_expire: "Ce lien de réinitialisation a expiré (il n'est valable qu'une heure). Retourne dans le jeu et clique de nouveau sur « mot de passe oublié »."
		};

		const params = new URLSearchParams(window.location.search);
		const token = params.get("token");

		if (!token) {
			afficherResultat("⚠️", "erreur", "Lien incomplet",
				"Ce lien ne contient pas de code de réinitialisation. Ouvre le lien complet reçu par email, ou retourne dans le jeu pour en demander un nouveau.");
		} else {
			document.getElementById("formulaire").addEventListener("submit", function (evenement) {
				evenement.preventDefault();
				const mdp = document.getElementById("mdp").value;
				const mdp2 = document.getElementById("mdp2").value;
				const erreurChamp = document.getElementById("erreur-champ");
				erreurChamp.style.display = "none";

				if (mdp.length < LONGUEUR_MIN_MDP) {
					erreurChamp.textContent = "Le mot de passe doit faire au moins " + LONGUEUR_MIN_MDP + " caractères.";
					erreurChamp.style.display = "block";
					return;
				}
				if (mdp !== mdp2) {
					erreurChamp.textContent = "Les mots de passe ne correspondent pas.";
					erreurChamp.style.display = "block";
					return;
				}

				const bouton = document.getElementById("bouton");
				bouton.disabled = true;
				bouton.textContent = "Validation…";

				const sel = genererSelHex();
				hacherMotDePasse(sel, mdp).then(function (hash) {
					return fetch(RPC_URL, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							"apikey": ANON_KEY,
							"Authorization": "Bearer " + ANON_KEY
						},
						body: JSON.stringify({ p_token: token, p_nouveau_mdp_hash: hash, p_nouveau_mdp_sel: sel })
					});
				})
				.then(function (reponse) {
					return reponse.json().catch(function () { return {}; }).then(function (corps) {
						return { ok: reponse.ok, corps: corps };
					});
				})
				.then(function (resultat) {
					if (resultat.ok) {
						afficherResultat("✅", "ok", "Mot de passe changé !",
							"Tu peux fermer cette page et retourner dans le jeu avec ton nouveau mot de passe.");
					} else {
						const message = resultat.corps && resultat.corps.message;
						afficherResultat("⚠️", "erreur", "Réinitialisation impossible",
							MESSAGES_ERREUR[message] || "Une erreur inattendue est survenue. Réessaie un peu plus tard, ou retourne dans le jeu pour demander un nouveau lien.");
					}
				})
				.catch(function () {
					afficherResultat("⚠️", "erreur", "Connexion impossible",
						"Impossible de contacter le serveur pour l'instant. Vérifie ta connexion internet et réessaie en rouvrant le lien reçu par email.");
				});
			});
		}
	</script>
</body>
</html>
